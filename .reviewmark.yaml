---
# ReviewMark Configuration File
#
# Defines which files require formal review, where the review evidence is stored, and how the
# files are grouped into named review-sets following the hierarchical scope principles of the
# ReviewMark usage standard: user-facing purpose, decomposition, system architecture, design,
# verification, and requirements, then the Program unit, then one review-set per OTS item.

# Files needing review. Processed in order; a pattern starting with '!' excludes files.
needs-review:
  - README.md
  - docs/user_guide/**/*.md
  - '**/*.cs'
  - requirements.yaml
  - docs/reqstream/**/*.yaml
  - docs/design/**/*.md
  - docs/sysml2/**/*.sysml
  - docs/verification/**/*.md
  - '!**/obj/**'
  - '!**/bin/**'
  - '!**/generated/**'
  - '!**/.venv/**'

# Source of review evidence. No formal reviews have been recorded yet; change this to type 'url'
# (for example a 'reviews' branch index.json) once review evidence is published.
evidence-source:
  type: none

# Context included for all reviews.
context:
  - docs/design/introduction.md

reviews:
  # Purpose Review (only one per repository)
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - '!docs/design/introduction.md'
    paths:
      - README.md
      - docs/user_guide/**/*.md

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that DotnetToolWrapper Decomposition Addresses the Stated Purpose
    context:
      - README.md
      - docs/user_guide/**/*.md
    paths:
      - requirements.yaml
      - docs/reqstream/quality.yaml
      - docs/design/introduction.md
      - docs/sysml2/**/*.sysml

  # DotnetToolWrapper system reviews
  - id: DotnetToolWrapper-Architecture
    title: Review that DotnetToolWrapper Architecture Satisfies Requirements
    context:
      - README.md
      - docs/user_guide/**/*.md
    paths:
      - docs/reqstream/dotnet-tool-wrapper.yaml
      - docs/design/introduction.md
      - docs/design/dotnet-tool-wrapper.md
      - docs/verification/introduction.md
      - docs/verification/dotnet-tool-wrapper.md
      - test/**/DotnetToolWrapperTests.cs
      - test/**/Runner.cs
      - test/**/AssemblyInfo.cs

  - id: DotnetToolWrapper-Design
    title: Review that DotnetToolWrapper Design is Consistent and Complete
    context:
      - docs/reqstream/dotnet-tool-wrapper.yaml
    paths:
      - docs/reqstream/dotnet-tool-wrapper/platform-requirements.yaml
      - docs/design/introduction.md
      - docs/design/dotnet-tool-wrapper.md
      - docs/design/dotnet-tool-wrapper/**/*.md
      - docs/design/ots.md

  - id: DotnetToolWrapper-Verification
    title: Review that DotnetToolWrapper Verification is Consistent and Complete
    context:
      - docs/reqstream/dotnet-tool-wrapper.yaml
    paths:
      - docs/verification/introduction.md
      - docs/verification/dotnet-tool-wrapper.md
      - docs/verification/dotnet-tool-wrapper/**/*.md
      - docs/verification/ots.md

  - id: DotnetToolWrapper-AllRequirements
    title: Review that All DotnetToolWrapper Requirements are Complete
    context:
      - docs/design/dotnet-tool-wrapper.md
      - docs/reqstream/dotnet-tool-wrapper.yaml
    paths:
      - docs/reqstream/dotnet-tool-wrapper/**/*.yaml

  # DotnetToolWrapper Program unit review
  - id: DotnetToolWrapper-Program
    title: Review that DotnetToolWrapper Program Implementation is Correct
    context:
      - docs/design/dotnet-tool-wrapper.md
      - docs/reqstream/dotnet-tool-wrapper.yaml
    paths:
      - docs/reqstream/dotnet-tool-wrapper/program.yaml
      - docs/design/dotnet-tool-wrapper/program.md
      - docs/verification/dotnet-tool-wrapper/program.md
      - src/**/Program.cs
      - test/**/ProgramTests.cs

  # OTS reviews (one per OTS item)
  - id: OTS-BuildMark
    title: Review that BuildMark Provides Required Functionality
    paths:
      - docs/reqstream/ots/buildmark.yaml
      - docs/design/ots/buildmark.md
      - docs/verification/ots/buildmark.md
  - id: OTS-CanvasNet
    title: Review that CanvasNet Provides Required Functionality
    paths:
      - docs/reqstream/ots/canvasnet.yaml
      - docs/design/ots/canvasnet.md
      - docs/verification/ots/canvasnet.md

  - id: OTS-FileAssert
    title: Review that FileAssert Provides Required Functionality
    paths:
      - docs/reqstream/ots/fileassert.yaml
      - docs/design/ots/fileassert.md
      - docs/verification/ots/fileassert.md

  - id: OTS-LintMark
    title: Review that LintMark Provides Required Functionality
    paths:
      - docs/reqstream/ots/lintmark.yaml
      - docs/design/ots/lintmark.md
      - docs/verification/ots/lintmark.md

  - id: OTS-Pandoc
    title: Review that Pandoc Provides Required Functionality
    paths:
      - docs/reqstream/ots/pandoc.yaml
      - docs/design/ots/pandoc.md
      - docs/verification/ots/pandoc.md

  - id: OTS-ReqStream
    title: Review that ReqStream Provides Required Functionality
    paths:
      - docs/reqstream/ots/reqstream.yaml
      - docs/design/ots/reqstream.md
      - docs/verification/ots/reqstream.md

  - id: OTS-ReviewMark
    title: Review that ReviewMark Provides Required Functionality
    paths:
      - docs/reqstream/ots/reviewmark.yaml
      - docs/design/ots/reviewmark.md
      - docs/verification/ots/reviewmark.md

  - id: OTS-SpdxTool
    title: Review that SpdxTool Provides Required Functionality
    paths:
      - docs/reqstream/ots/spdx-tool.yaml
      - docs/design/ots/spdx-tool.md
      - docs/verification/ots/spdx-tool.md

  - id: OTS-SysML2Tools
    title: Review that SysML2Tools Provides Required Functionality
    paths:
      - docs/reqstream/ots/sysml2tools.yaml
      - docs/design/ots/sysml2tools.md
      - docs/verification/ots/sysml2tools.md

  - id: OTS-TextLint
    title: Review that TextLint Provides Required Functionality
    paths:
      - docs/reqstream/ots/textlint.yaml
      - docs/design/ots/textlint.md
      - docs/verification/ots/textlint.md

  - id: OTS-VersionMark
    title: Review that VersionMark Provides Required Functionality
    paths:
      - docs/reqstream/ots/versionmark.yaml
      - docs/design/ots/versionmark.md
      - docs/verification/ots/versionmark.md

  - id: OTS-WeasyPrint
    title: Review that WeasyPrint Provides Required Functionality
    paths:
      - docs/reqstream/ots/weasyprint.yaml
      - docs/design/ots/weasyprint.md
      - docs/verification/ots/weasyprint.md

  - id: OTS-xUnit
    title: Review that xUnit Provides Required Functionality
    paths:
      - docs/reqstream/ots/xunit.yaml
      - docs/design/ots/xunit.md
      - docs/verification/ots/xunit.md
