---
# ReviewMark OTS requirements
#
# DemaConsulting.ReviewMark checks .reviewmark.yaml and the review-set coverage in lint.ps1, and
# generates the Review Plan and the Review Report in the CI documents job. Its self-validation
# results are the evidence.
sections:
  - title: OTS Software Requirements
    sections:
      - title: ReviewMark Requirements
        requirements:
          - id: DotnetToolWrapper-OTS-ReviewMark-Documents
            title: >-
              ReviewMark shall generate a review plan of the review-sets covering each file needing review, and a
              review report of the review status of each review-set.
            justification: |
              The CI documents job publishes the Review Plan and the Review Report generated by
              ReviewMark from .reviewmark.yaml and the review evidence, so that reviewers and
              auditors can see which review-set covers each file and whether its review is current.
              The self-validation proves plan and report generation.
            tags: [ots]
            tests:
              - ReviewMark_ReviewPlanGeneration
              - ReviewMark_ReviewReportGeneration

          - id: DotnetToolWrapper-OTS-ReviewMark-Lint
            title: ReviewMark shall report structural problems in the review configuration file.
            justification: |
              lint.ps1 runs ReviewMark with --lint so that a malformed .reviewmark.yaml fails the
              quality checks before the review documents are generated.
            tags: [ots]
            tests:
              - ReviewMark_Lint

          - id: DotnetToolWrapper-OTS-ReviewMark-Enforce
            title: >-
              ReviewMark shall exit with a non-zero code when run with --enforce and the generated review document
              has issues.
            justification: |
              lint.ps1 and the CI documents job generate the review plan with --enforce, so a file that
              needs review but is not covered by any review-set fails the build. The review report is not
              generated with --enforce until review evidence is published, because every review-set is
              reported without current evidence until then. The self-validation proves the enforcement.
            tags: [ots]
            tests:
              - ReviewMark_Enforce
