---
# Pandoc OTS requirements
#
# DemaConsulting.PandocTool converts the Markdown sources of each document collection to HTML in
# the CI documents job. The FileAssert checks of the generated HTML are the evidence.
sections:
  - title: OTS Software Requirements
    sections:
      - title: Pandoc Requirements
        requirements:
          - id: DotnetToolWrapper-OTS-Pandoc
            title: Pandoc shall convert the Markdown sources of a document collection into one HTML document.
            justification: |
              The CI documents job converts each document collection to HTML with Pandoc before
              WeasyPrint renders it to PDF. FileAssert checks that the generated HTML exists, has a
              title element, embeds its pictures where the document has any, and contains the expected
              content, which proves that Pandoc ran correctly. The listed tests cover the seven
              collections built before ReqStream runs (Build Notes, Code Quality Report, Review Plan,
              Review Report, Software Design Document, Software Verification Design Document, and User
              Guide). The Requirements Document and Trace Matrix are built from the ReqStream output, so
              their FileAssert checks run after ReqStream and are not evidence for this requirement.
            tags: [ots]
            tests:
              - Pandoc_UserGuideHtml
              - Pandoc_DesignHtml
              - Pandoc_VerificationHtml
              - Pandoc_ReviewPlanHtml
              - Pandoc_ReviewReportHtml
              - Pandoc_BuildNotesHtml
              - Pandoc_CodeQualityHtml
