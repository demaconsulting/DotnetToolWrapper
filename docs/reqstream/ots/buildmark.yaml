---
# BuildMark OTS requirements
#
# DemaConsulting.BuildMark generates the build notes of each build from the Git history and the
# GitHub issues and pull requests in the CI documents job. Its self-validation results are the
# evidence.
sections:
  - title: OTS Software Requirements
    sections:
      - title: BuildMark Requirements
        requirements:
          - id: DotnetToolWrapper-OTS-BuildMark
            title: >-
              BuildMark shall generate a Markdown build-notes report of the version, changes, fixed bugs, and known
              issues of a build from the Git history and the GitHub issues and pull requests.
            justification: |
              The CI documents job publishes the Build Notes generated by BuildMark, and the release
              workflow uses them as the release notes, so the changes in each release are recorded
              without hand-written notes. The self-validation covers report generation, Git
              history, issue and pull request tracking, known issues, and the routing of items to
              report sections.
            tags: [ots]
            tests:
              - BuildMark_MarkdownReportGeneration
              - BuildMark_GitIntegration
              - BuildMark_IssueTracking
              - BuildMark_KnownIssuesReporting
              - BuildMark_RulesRouting
