---
# FileAssert OTS requirements
#
# DemaConsulting.FileAssert checks the generated documents in the CI documents job. Its
# self-validation results are the evidence.
sections:
  - title: OTS Software Requirements
    sections:
      - title: FileAssert Requirements
        requirements:
          - id: DotnetToolWrapper-OTS-FileAssert
            title: >-
              FileAssert shall fail when a generated document is missing or lacks the expected HTML, PDF, or
              text content.
            justification: |
              FileAssert checks every HTML and PDF document produced by the CI documents job and
              fails the build when one is missing or lacks its expected content. Its results are
              the evidence for the Pandoc and WeasyPrint requirements, so the self-validation
              proves that the tool records results and checks files, text, HTML, and PDF content.
            tags: [ots]
            tests:
              - FileAssert_Results
              - FileAssert_File
              - FileAssert_Text
              - FileAssert_Html
              - FileAssert_Pdf
