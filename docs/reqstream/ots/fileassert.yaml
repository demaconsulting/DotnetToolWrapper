---
# FileAssert OTS requirements
#
# DemaConsulting.FileAssert checks the generated documents in the CI documents job. Its
# self-validation results are the evidence.
sections:
  - title: OTS Software Requirements
    sections:
      - title: FileAssert Requirements
        requirements:
          - id: DotnetToolWrapper-OTS-FileAssert
            title: >-
              FileAssert shall fail when a generated diagram or document is missing or lacks the expected HTML, XML,
              PDF, or text content.
            justification: |
              FileAssert checks every diagram, HTML, and PDF document produced by the CI documents
              job and fails the build when one is missing or lacks its expected content. Its results
              are the evidence for the SysML2Tools rendering, Pandoc, and WeasyPrint requirements, so
              the self-validation proves that the tool records results and checks files, text, HTML,
              XML, and PDF content.
            tags: [ots]
            tests:
              - FileAssert_Results
              - FileAssert_File
              - FileAssert_Text
              - FileAssert_Html
              - FileAssert_Xml
              - FileAssert_Pdf
