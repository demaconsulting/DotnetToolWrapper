<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. Native executables for each platform and the DotnetToolWrapper.json target map
       flow into the DotnetToolWrapper .NET tool entry point, which is packed into a NuGet tool package and, at run
       time, picks the executable for the host target, runs it, and returns its exit code.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>


  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176" style="font-size:52px">Dotnet</text>
  <text class="word brandText" x="216.6" y="176" style="font-size:52px">ToolWrapper</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Run native applications</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">as .NET Tools.</text>
  <text class="body" x="58" y="368">Picks the native executable for the</text>
  <text class="body" x="58" y="402">host OS and architecture, passes the</text>
  <text class="body" x="58" y="436">arguments, returns its exit code.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">dotnet tool install -g</text>
  <text class="cmd file" x="138" y="539">My.Tool.Package</text>
  <text class="note" x="58" y="604">.NET 8, 9, 10, and 11 &#183; MIT License</text>

  <!-- Input cards -->
  <g>
    <!-- Windows executable: the native program built for win-x64 -->
    <rect class="card" x="580" y="40" width="196" height="160" rx="16"/>
    <rect x="622" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="180" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <rect x="20" y="12" width="140" height="34" rx="8" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
      <text class="miniMono" x="90" y="37" fill="#fde68a" text-anchor="middle">win-x64</text>
      <rect x="44" y="58" width="92" height="44" rx="7" fill="#111827" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.5"/>
      <text class="miniMono" x="90" y="88" fill="#f8fafc" text-anchor="middle">.exe</text>
    </g>
    <text class="label" x="678" y="190">Windows .exe</text>

    <!-- Linux executable: the native program built for linux-x64 -->
    <rect class="card" x="788" y="40" width="196" height="160" rx="16"/>
    <rect x="830" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="796" y="48" width="180" height="112" rx="10"/>
    <g transform="translate(796 48)">
      <rect x="20" y="12" width="140" height="34" rx="8" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="miniMono" x="90" y="37" fill="#a5f3fc" text-anchor="middle">linux-x64</text>
      <rect x="44" y="58" width="92" height="44" rx="7" fill="#111827" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5"/>
      <text class="miniMono" x="90" y="88" fill="#f8fafc" text-anchor="middle">&gt;_</text>
    </g>
    <text class="label" x="886" y="190">Linux binary</text>

    <!-- macOS executable: the native program built for osx-arm64 -->
    <rect class="card" x="996" y="40" width="196" height="160" rx="16"/>
    <rect x="1038" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1004" y="48" width="180" height="112" rx="10"/>
    <g transform="translate(1004 48)">
      <rect x="20" y="12" width="140" height="34" rx="8" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-width="1.5"/>
      <text class="miniMono" x="90" y="37" fill="#fbcfe8" text-anchor="middle">osx-arm64</text>
      <rect x="44" y="58" width="92" height="44" rx="7" fill="#111827" stroke="#f472b6" stroke-opacity="0.6" stroke-width="1.5"/>
      <text class="miniMono" x="90" y="88" fill="#f8fafc" text-anchor="middle">&gt;_</text>
    </g>
    <text class="label" x="1094" y="190">macOS binary</text>

    <!-- DotnetToolWrapper.json: the map from each target to its native program -->
    <rect class="card" x="1204" y="40" width="356" height="160" rx="16"/>
    <rect x="1326" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1212" y="48" width="340" height="112" rx="10"/>
    <g transform="translate(1212 48)">
      <text class="miniMono" x="16" y="32" fill="#93c5fd">"linux-x64"</text>
      <text class="miniMono" x="161" y="32" fill="#f8fafc">: {</text>
      <text class="miniMono" x="42" y="66" fill="#93c5fd">"program"</text>
      <text class="miniMono" x="161" y="66" fill="#f8fafc">:</text>
      <text class="miniMono" x="188" y="66" fill="#f9a8d4">"my-tool"</text>
      <text class="miniMono" x="16" y="100" fill="#f8fafc">}</text>
    </g>
    <text class="label" x="1382" y="190">DotnetToolWrapper.json</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M678,206 C678,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M886,206 C886,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1094,206 C1094,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1382,206 C1382,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="678" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="886" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1094" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1382" cy="206" r="5" fill="#60a5fa"/>
  </g>
  <!-- The engine: the DotnetToolWrapper entry point, widened for its 17-character name -->
  <rect x="785" y="262" width="570" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="785" y="262" width="570" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="809" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M818 282 L831 282 L837 288 L837 306 L818 306 Z" fill="#ffffff"/>
  <g fill="#7c3aed">
    <rect x="822" y="290" width="11" height="2.5" rx="1.2"/>
    <rect x="822" y="295" width="11" height="2.5" rx="1.2"/>
    <rect x="822" y="300" width="7" height="2.5" rx="1.2"/>
  </g>
  <text class="engine" x="861" y="305">DotnetToolWrapper</text>
  <line x1="1200" y1="278" x2="1200" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1220" y="303">.NET tool</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Package via NuGet: nuget pack puts the wrapper and the native programs into one tool package -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <g stroke="#94a3b8" stroke-width="2" fill="none">
      <path d="M614 444 L614 518 L636 518"/>
      <path d="M614 474 L636 474"/>
    </g>
    <rect x="603" y="414" width="26" height="24" rx="4" fill="#a78bfa"/>
    <rect x="612" y="414" width="8" height="10" fill="#ffffff" fill-opacity="0.55"/>
    <text class="miniMono" x="640" y="436" fill="#f8fafc">My.Tool.nupkg</text>
    <path d="M640 464 L650 464 L654 469 L666 469 L666 484 L640 484 Z" fill="#5eead4"/>
    <text class="miniMono" x="676" y="482" fill="#f8fafc">tools/net8.0/</text>
    <path d="M640 508 L650 508 L654 513 L666 513 L666 528 L640 528 Z" fill="#5eead4"/>
    <text class="miniMono" x="676" y="526" fill="#f8fafc">linux-x64/</text>
    <text class="label" x="728" y="585">Package via NuGet</text>

    <!-- Host target: the entry for the host's os-arch target is picked -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="999" y="436" fill="#64748b" text-anchor="middle">win-x64</text>
    <rect x="922" y="456" width="154" height="36" rx="18" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
    <text class="miniMono" x="999" y="481" fill="#bbf7d0" text-anchor="middle">linux-x64</text>
    <text class="miniMono" x="999" y="530" fill="#64748b" text-anchor="middle">osx-arm64</text>
    <text class="label" x="999" y="585">Host target</text>

    <!-- Native run: the program runs with the same arguments in the current directory -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="1146" y="436" fill="#5eead4">$</text>
    <text class="miniMono" x="1172" y="436" fill="#f8fafc">my-tool</text>
    <text class="miniMono" x="1172" y="466" fill="#f9a8d4">a.txt -v</text>
    <line x1="1146" y1="484" x2="1318" y2="484" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect class="bar" x="1146" y="500" width="150" height="8" rx="4" fill-opacity="0.75"/>
    <rect class="bar" x="1146" y="522" width="112" height="8" rx="4" fill-opacity="0.75"/>
    <text class="label" x="1232" y="585">Native run</text>

    <!-- Exit code: the program's exit code is returned to the caller -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <circle cx="1457" cy="448" r="26" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="2.5"/>
    <path d="M1444 448 L1453 458 L1471 437" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1395" y="494" width="124" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#e2e8f0" text-anchor="middle">exit 0</text>
    <text class="label" x="1457" y="585">Exit code</text>
  </g>
</svg>