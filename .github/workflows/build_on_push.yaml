---
name: Build

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 1'  # 5PM UTC every Monday

jobs:
  # Calls the reusable build workflow to lint, build, test, and package the
  # wrapper for every push. The job name 'Build Artifacts' is part of the
  # required status check names, so keep it stable.
  build:
    name: Build Artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      semver: '0.0.0-run.${{ github.run_number }}'
      winver: '0.0.0.${{ github.run_number }}'
