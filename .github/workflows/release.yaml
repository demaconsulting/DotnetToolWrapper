---
name: Release

on:
  workflow_dispatch:
    inputs:
      semver:
        description: 'Release semantic version (1.2.3-rc.4)'
        required: true
        type: string
      winver:
        description: 'Release windows version (1.2.3.4)'
        required: true
        type: string
      publish:
        description: 'Release Type'
        required: true
        default: 'release'
        type: choice
        options:
          - none
          - release

jobs:
  # Calls the reusable build workflow to lint, build, test, and package the
  # wrapper for the release version.
  build:
    name: Build Artifacts
    permissions:
      contents: read
    uses: ./.github/workflows/build.yaml
    with:
      semver: ${{ inputs.semver }}
      winver: ${{ inputs.winver }}

  # Assembles DotnetToolWrapper.zip (one folder per target framework) and,
  # when requested, creates the GitHub release with the zip, the SBOM, and
  # the release documents (PDFs) built by the build workflow, using the
  # Build Notes generated by BuildMark as the release notes.
  release:
    name: Release Artifacts
    permissions:
      contents: write
      packages: write

    runs-on: ubuntu-latest

    needs: build

    steps:

      - uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Download Documents
        uses: actions/download-artifact@v8
        with:
          name: documents
          path: documents

      - name: Assemble
        shell: bash
        run: |
          mkdir -p dist/net8.0
          mkdir -p dist/net9.0
          mkdir -p dist/net10.0
          mkdir -p dist/net11.0
          cp build-artifacts/net8.0/*.* dist/net8.0
          cp build-artifacts/net9.0/*.* dist/net9.0
          cp build-artifacts/net10.0/*.* dist/net10.0
          cp build-artifacts/net11.0/*.* dist/net11.0
          cd dist
          zip -r ../DotnetToolWrapper.zip *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            DotnetToolWrapper.zip

      - name: Create release
        if: ${{ inputs.publish == 'release' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "DotnetToolWrapper.zip,build-artifacts/_manifest/spdx_2.2/*.*,documents/*.pdf"
          bodyFile: documents/build_notes.md
          generateReleaseNotes: false
          tag: ${{ inputs.semver }}
