---
# FileAssert document validation tests for DotnetToolWrapper.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: build-notes, code-quality, code-review, design, verification, user-guide, requirements.
#
# NOTE: the build-notes, code-quality, code-review, design, verification, and user-guide tests
# provide OTS evidence for SysML2Tools, Pandoc, and WeasyPrint and run before ReqStream. The
# requirements tests run after ReqStream and validate the final outputs, but do not contribute to
# OTS requirements evidence.
tests:

  # --- BUILD NOTES ---
  - name: Pandoc_BuildNotesHtml
    description: Build Notes HTML was generated by Pandoc
    tags: [build-notes]
    files:
      - pattern: docs/build_notes/generated/build_notes.html
        count: 1
        html:
          - query: //head/title
            count: 1
        text:
          - contains: Build Notes
          - contains: Version Information
          - contains: Tool Versions
  - name: WeasyPrint_BuildNotesPdf
    description: Build Notes PDF was generated by WeasyPrint
    tags: [build-notes]
    files:
      - pattern: docs/generated/DotnetToolWrapper Build Notes.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: Build Notes
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: Build Notes
          pages:
            min: 2
          text:
            - contains: Build Notes
            - contains: Version Information
            - contains: versionmark

  # --- CODE QUALITY REPORT ---
  - name: Pandoc_CodeQualityHtml
    description: Code Quality HTML was generated by Pandoc
    tags: [code-quality]
    files:
      - pattern: docs/code_quality/generated/quality.html
        count: 1
        html:
          - query: //head/title
            count: 1
        text:
          - contains: Code Quality
          - contains: CodeQL
  - name: WeasyPrint_CodeQualityPdf
    description: Code Quality PDF was generated by WeasyPrint
    tags: [code-quality]
    files:
      - pattern: docs/generated/DotnetToolWrapper Code Quality Report.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: Code Quality
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: Code Quality
          pages:
            min: 2
          text:
            - contains: Code Quality
            - contains: CodeQL

  # --- CODE REVIEW DOCUMENTS ---
  - name: Pandoc_ReviewPlanHtml
    description: Review Plan HTML was generated by Pandoc
    tags: [code-review]
    files:
      - pattern: docs/code_review_plan/generated/plan.html
        count: 1
        html:
          - query: //head/title
            count: 1
        text:
          - contains: Review Plan
          - contains: DotnetToolWrapper-Program
  - name: WeasyPrint_ReviewPlanPdf
    description: Review Plan PDF was generated by WeasyPrint
    tags: [code-review]
    files:
      - pattern: docs/generated/DotnetToolWrapper Review Plan.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: Review Plan
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: Review Plan
          pages:
            min: 2
          text:
            - contains: Review Plan
            - contains: Review Coverage
  - name: Pandoc_ReviewReportHtml
    description: Review Report HTML was generated by Pandoc
    tags: [code-review]
    files:
      - pattern: docs/code_review_report/generated/report.html
        count: 1
        html:
          - query: //head/title
            count: 1
        text:
          - contains: Review Report
          - contains: DotnetToolWrapper-Program
  - name: WeasyPrint_ReviewReportPdf
    description: Review Report PDF was generated by WeasyPrint
    tags: [code-review]
    files:
      - pattern: docs/generated/DotnetToolWrapper Review Report.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: Review Report
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: Review Report
          pages:
            min: 2
          text:
            - contains: Review Report
            - contains: Review Status

  # --- DESIGN DOCUMENT ---
  - name: SysML2Tools_DesignDiagramsSvg
    description: Design diagrams were rendered by SysML2Tools
    tags: [design]
    files:
      - pattern: docs/design/generated/SoftwareStructureView.svg
        count: 1
        min-size: 100
        xml:
          - query: "//*[local-name()='svg']"
            count: 1
      - pattern: docs/design/generated/DotnetToolWrapperView.svg
        count: 1
        min-size: 100
        xml:
          - query: "//*[local-name()='svg']"
            count: 1
  - name: Pandoc_DesignHtml
    description: Design HTML was generated by Pandoc
    tags: [design]
    files:
      - pattern: docs/design/generated/design.html
        count: 1
        html:
          - query: //head/title
            count: 1
          - query: //img
            count: 3
        text:
          - contains: Software Design Document
  - name: WeasyPrint_DesignPdf
    description: Design PDF was generated by WeasyPrint
    tags: [design]
    files:
      - pattern: docs/generated/DotnetToolWrapper Software Design Document.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: Design
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: Design
          pages:
            min: 20
          text:
            - contains: Software Design Document
            - contains: DotnetToolWrapper.json

  # --- VERIFICATION DOCUMENT ---
