      - pattern: docs/generated/DotnetToolWrapper User Guide.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: User Guide
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: User Guide
          pages:
            min: 10
          text:
