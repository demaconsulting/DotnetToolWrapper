---
# FileAssert document validation tests for DotnetToolWrapper.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: user-guide, requirements.
#
# NOTE: the user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence.
tests:

  # --- USER GUIDE ---
  - name: Pandoc_UserGuideHtml
    description: User Guide HTML was generated by Pandoc
    tags: [user-guide]
    files:
      - pattern: docs/user_guide/generated/user_guide.html
        count: 1
        html:
          - query: //head/title
            count: 1
          - query: //img
            count: 1
        text:
          - contains: User Guide
  - name: WeasyPrint_UserGuidePdf
    description: User Guide PDF was generated by WeasyPrint
    tags: [user-guide]
    files:
      - pattern: docs/generated/DotnetToolWrapper User Guide.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: User Guide
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: User Guide
          pages:
            min: 10
          text:
            - contains: User Guide
            - contains: DotnetToolWrapper.json

  # --- REQUIREMENTS DOCUMENT ---
  - name: Pandoc_RequirementsHtml
    description: Requirements HTML was generated by Pandoc
    tags: [requirements]
    files:
      - pattern: docs/requirements_doc/generated/requirements.html
        count: 1
        html:
          - query: //head/title
            count: 1
        text:
          - contains: Requirements
  - name: WeasyPrint_RequirementsPdf
    description: Requirements PDF was generated by WeasyPrint
    tags: [requirements]
    files:
      - pattern: docs/generated/DotnetToolWrapper Requirements Document.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: Requirements
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: Requirements
          pages:
            min: 1
          text:
            - contains: Requirements

  # --- TRACE MATRIX ---
  - name: Pandoc_TraceMatrixHtml
    description: Trace Matrix HTML was generated by Pandoc
    tags: [requirements]
    files:
      - pattern: docs/requirements_report/generated/trace_matrix.html
        count: 1
        html:
          - query: //head/title
            count: 1
        text:
          - contains: Trace Matrix
  - name: WeasyPrint_TraceMatrixPdf
    description: Trace Matrix PDF was generated by WeasyPrint
    tags: [requirements]
    files:
      - pattern: docs/generated/DotnetToolWrapper Trace Matrix.pdf
        count: 1
        pdf:
          metadata:
            - field: Title
              contains: Trace Matrix
            - field: Author
              contains: "DEMA Consulting"
            - field: Subject
              contains: Trace Matrix
          pages:
            min: 1
          text:
            - contains: Trace Matrix
